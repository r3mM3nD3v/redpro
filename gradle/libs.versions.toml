[versions]
agp = "8.7.2"
kotlin = "2.0.21"
googleServices = "4.4.4"

compileSdk = "36"
minSdk = "31"
targetSdk = "36"

coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
recyclerview = "1.3.2"
activityKtx = "1.9.3"
fragmentKtx = "1.8.4"
constraintlayout = "2.1.4"

junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"

coroutinesAndroid = "1.9.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services", version.ref = "googleServices" }
secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version = "2.0.1" }

[libraries]
androidx-core-ktx         = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat        = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material                  = { module = "com.google.android.material:material", version.ref = "material" }
androidx-recyclerview     = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-activity         = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-fragment         = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

junit                     = { module = "junit:junit", version.ref = "junit" }
androidx-junit            = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
espresso-core             = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }